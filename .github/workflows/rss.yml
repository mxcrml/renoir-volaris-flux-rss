name: Générer les flux RSS

on:
  schedule:
    # Tous les jours à 7h00 UTC (8h/9h heure de Paris selon la saison)
    - cron: "0 7 * * *"
  workflow_dispatch: {}   # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write         # nécessaire pour committer les feeds et states

jobs:
  build-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4 feedgen

      - name: Générer le feed annonces
        run: python renoir_valoris_rss.py

      - name: Générer le feed blog
        run: python renoir_valoris_blog_rss.py

      - name: Committer les feeds mis à jour
        run: |
          git config user.name "rss-bot"
          git config user.email "actions@github.com"
          git add feed.xml state.json feed_blog.xml state_blog.json
          git diff --cached --quiet || git commit -m "MAJ feeds $(date -u +%F)"
          git pull --rebase origin main
          git push
